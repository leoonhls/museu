<!-- Responsável: M8 — veja a seção "M8 — Área administrativa" no Guia da Entrega 1 -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gerenciar acervo — Museu</title>
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/pages/admin.css">
</head>
<body>
  <div id="header"></div>
  <main class="container">
    <h1>Gerenciar acervo</h1>
    
<div class="admin-acoes">
  <label for="busca-obras">Pesquisar obras</label>

  <input
    type="search"
    id="busca-obras"
    placeholder="Digite o título ou artista"
  >

  <a href="obra-form.html" class="botao">
    + Nova obra
  </a>
</div>

<div class="admin-tabela">
  <table>
    <thead>
      <tr>
        <th>Imagem</th>
        <th>Título</th>
        <th>Artista</th>
        <th>Categoria</th>
        <th>Ano</th>
        <th>Em exibição</th>
        <th>Ações</th>
      </tr>
    </thead>

    <tbody id="lista-obras">
      <!-- O JavaScript preencherá as obras aqui -->
    </tbody>
  </table>
</div>

<div class="admin-paginacao">
  <button type="button" class="botao botao--secundario" id="pagina-anterior">
    Anterior
  </button>

  <span id="info-pagina"></span>

  <button type="button" class="botao botao--secundario" id="proxima-pagina">
    Próxima
  </button>
</div>


  </main>
  <div id="footer"></div>
  <script type="module" src="../../js/pages/admin-obras.js"></script>
</body>
</html>
