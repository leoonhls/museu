<!-- Responsável: M7 — veja a seção "M7 — Login e favoritos" no Guia da Entrega 1 -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Criar conta — Museu</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages/login.css">
</head>
<body>
  <div id="header"></div>
  <main class="container login">
    <section class="card login__painel">
      <h1>Criar conta</h1>
      <form id="formCadastro" novalidate>
        <div class="campo">
          <label for="nomeCadastro">Nome</label>
          <input id="nomeCadastro" name="nome" type="text" autocomplete="name" minlength="3" required>
        </div>
        <div class="campo">
          <label for="emailCadastro">E-mail</label>
          <input id="emailCadastro" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="campo">
          <label for="tipoCadastro">Tipo de cadastro</label>
          <select id="tipoCadastro" name="tipoCadastro" required>
            <option value="" selected disabled>Selecione uma opção</option>
            <option value="estudante">Estudante</option>
            <option value="pesquisador">Pesquisador</option>
            <option value="administrador">Administrador</option>
            <option value="visitante">Visitante</option>
          </select>
          <small>A seleção de administrador não concede permissões administrativas.</small>
        </div>
        <div class="campo">
          <label for="senhaCadastro">Senha</label>
          <div class="login__senha">
            <input id="senhaCadastro" name="senha" type="password" autocomplete="new-password" minlength="8" pattern="(?=.*[A-Za-z])(?=.*[0-9]).{8,}" aria-describedby="dicaSenhaCadastro" required>
            <button class="login__ver-senha" type="button" aria-label="Mostrar senha" aria-pressed="false" data-alvo-senha="senhaCadastro">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
          <small id="dicaSenhaCadastro">Use pelo menos 8 caracteres, incluindo letras e números.</small>
        </div>
        <div class="campo">
          <label for="confirmarSenhaCadastro">Confirmar senha</label>
          <div class="login__senha">
            <input id="confirmarSenhaCadastro" name="confirmarSenha" type="password" autocomplete="new-password" minlength="8" pattern="(?=.*[A-Za-z])(?=.*[0-9]).{8,}" required>
            <button class="login__ver-senha" type="button" aria-label="Mostrar confirmação da senha" aria-pressed="false" data-alvo-senha="confirmarSenhaCadastro">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>
        <button class="botao" type="submit">Cadastrar</button>
      </form>
      <p class="login__alternativa">Já tem cadastro? <a class="login__link" href="login.html">Entrar</a></p>
      <p class="mensagem" id="mensagemCadastro" role="status" aria-live="polite"></p>
    </section>
  </main>
  <div id="footer"></div>
  <script type="module" src="../js/pages/cadastro.js"></script>
</body>
</html>
