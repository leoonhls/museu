<!-- Responsável: M7 — veja a seção "M7 — Login e favoritos" no Guia da Entrega 1 -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — Museu</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/pages/login.css">
</head>
<body>
  <div id="header"></div>
  <main class="container login" id="paineisConta">
    <section class="card login__painel" id="painelLogin">
      <h1>Entrar</h1>
      <form id="formLogin" novalidate>
        <div class="campo">
          <label for="emailLogin">E-mail</label>
          <input id="emailLogin" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="campo">
          <label for="senhaLogin">Senha</label>
          <div class="login__senha">
            <input id="senhaLogin" name="senha" type="password" autocomplete="current-password" required>
            <button class="login__ver-senha" type="button" aria-label="Mostrar senha" aria-pressed="false" data-alvo-senha="senhaLogin">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>
        <button class="botao" type="submit">Entrar</button>
      </form>
      <p class="login__alternativa">
        <button class="login__link" id="mostrarRecuperacao" type="button">Esqueci minha senha</button>
      </p>
      <p class="login__alternativa">
        Ainda não tem cadastro?
        <a class="botao" href="cadastro.html" target="_blank" rel="noopener">Cadastrar</a>
      </p>
      <p class="mensagem" id="mensagemLogin" role="status" aria-live="polite"></p>
    </section>

    <section class="card login__painel" id="painelRecuperacao" hidden>
      <h1>Redefinir senha</h1>
      <p class="login__aviso">Nesta versão local, a senha é redefinida neste navegador. Nenhum e-mail é enviado nem a identidade é verificada.</p>
      <form id="formRecuperacao" novalidate>
        <div class="campo">
          <label for="emailRecuperacao">E-mail cadastrado</label>
          <input id="emailRecuperacao" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="campo">
          <label for="senhaRecuperacao">Nova senha</label>
          <div class="login__senha">
            <input id="senhaRecuperacao" name="senha" type="password" autocomplete="new-password" minlength="8" pattern="(?=.*[A-Za-z])(?=.*[0-9]).{8,}" required>
            <button class="login__ver-senha" type="button" aria-label="Mostrar senha" aria-pressed="false" data-alvo-senha="senhaRecuperacao">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
          <small>Use pelo menos 8 caracteres, incluindo letras e números.</small>
        </div>
        <button class="botao" type="submit">Salvar nova senha</button>
      </form>
      <p class="login__alternativa">Lembrou a senha? <button class="login__link" id="voltarLogin" type="button">Voltar para entrar</button></p>
      <p class="mensagem" id="mensagemRecuperacao" role="status" aria-live="polite"></p>
    </section>
  </main>
  <div id="footer"></div>
  <script type="module" src="../js/pages/login.js"></script>
</body>
</html>
